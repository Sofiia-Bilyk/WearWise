server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend static files
    location / {
        try_files $uri $uri/ /index.html;
    }


    # Avoid recording Google's short-lived OAuth code in access logs.
    location = /api/calendar/google/callback {
        access_log off;
        proxy_pass http://backend:5001/calendar/google/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recommendation generation includes provider lookups and a bounded model call.
    location = /api/outfit-assistant/recommendations {
        proxy_pass http://backend:5001/outfit-assistant/recommendations;
        proxy_read_timeout 130s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Uploads requests to the backend container
    location /uploads/ {
        proxy_pass http://backend:5001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
